<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SafeView AI TV - Initializing</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .init-container {
      background-color: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
      border: 2px solid #00ff00;
      width: 350px;
    }
    
    .init-title {
      color: #00ff00;
      font-size: 24px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    
    .init-message {
      color: #ffffff;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    .spinner {
      border: 4px solid rgba(0, 255, 0, 0.3);
      border-radius: 50%;
      border-top: 4px solid #00ff00;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="init-container">
    <div class="init-title">SafeView AI TV</div>
    <div class="init-message">Initializing...</div>
    <div class="spinner"></div>
  </div>
  
  <script>
    // Close the popup after 3 seconds
    setTimeout(() => {
      window.close();
    }, 3000);
  </script>
</body>
</html>
